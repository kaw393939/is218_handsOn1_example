[pytest]
# Shared test discovery rules. Run `python -m pytest` from the project root.
# This INI file configures pytest; it does not install pytest or activate a venv.
# With no explicit test path on the command line, start discovery in tests/.
testpaths = tests
# Collect Python test files with this naming pattern.
python_files = test_*.py
# Optional test-grouping classes must start with Test (and have no __init__).
python_classes = Test*
# Collect standalone functions and class methods whose names start with test_.
python_functions = test_*
# The naming rules document our convention explicitly, even where pytest has
# similar defaults. No coverage, linting, or application type checking is enabled.
